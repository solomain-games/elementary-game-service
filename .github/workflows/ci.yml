name: CI

on:
  pull_request:
  push:
    branches: [main]

# Новый запуск для той же ветки отменяет предыдущий, ещё не завершённый
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          # Сервер github нужен, чтобы скачать game-core из GitHub Packages
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: PACKAGES_TOKEN

      - name: Build and test
        run: ./mvnw --batch-mode verify
        env:
          # GITHUB_TOKEN этого репозитория не может читать Maven-пакеты другого репозитория,
          # поэтому используется отдельный токен с правом read:packages (секрет организации)
          PACKAGES_TOKEN: ${{ secrets.GH_PACKAGES_READ_TOKEN }}
