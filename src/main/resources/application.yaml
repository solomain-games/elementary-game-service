# Общие настройки для всех профилей.
# Профиль выбирается переменной SPRING_PROFILES_ACTIVE; если не задан — local.

spring:
  application:
    name: game-service
  profiles:
    default: local

server:
  port: 8081

elementary:
  jwt:
    issuer: elementary-user-service   # должен совпадать с elementary.jwt.issuer в user-service
  rooms:
    ttl: 6h   # комната без изменений удаляется через 6 часов; каждое изменение продлевает срок
  timers:
    enabled: true             # планировщик таймеров (ход, голосование, отключение); в тестах выключен
    disconnect-timeout: 2m    # сколько ждём отключившегося игрока, прежде чем считать, что он вышел (ТЗ 4.5)
    reconnect-grace: 30s      # после старта партии и перезапуска сервиса: сколько ждём подключения, прежде чем отметить «отключён»

management:
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      probes:
        enabled: true   # /actuator/health/liveness и /readiness — пригодятся для Docker и облака
