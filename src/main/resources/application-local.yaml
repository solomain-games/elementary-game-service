# Профиль local: разработка на своём компьютере, Redis из elementary-infra/local.

spring:
  data:
    redis:
      host: localhost
      port: 6379

elementary:
  cases:
    dir: ../cases/cases   # соседний репозиторий elementary-cases (путь от папки game-service)
  jwt:
    jwk-set-uri: http://localhost:8082/.well-known/jwks.json   # user-service напрямую, не через шлюз
  websocket:
    allowed-origins: http://localhost:5173   # фронтенд на Vite

management:
  endpoint:
    health:
      show-details: always   # локально видно, какие компоненты UP или DOWN (например, redis)
